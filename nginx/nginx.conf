events { 
    worker_connections 1024; 
}

http {
    # Define the upstream cluster of backend servers
    upstream backend_servers {
        # These correspond to the service names and internal ports in docker-compose
        server url-backend-1:5000;
        server url-backend-2:5000;
        server url-backend-3:5000;
    }

    server {
        listen 80;

        # Forward all API and redirect requests to the backend cluster
        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}