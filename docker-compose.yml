version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: url_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: url_redis
    ports:
      - "6379:6379"

  # Backend Instances
  url-backend-1:
    build: ./backend         # Points to the backend folder containing your Dockerfile
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/shortener
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  url-backend-2:
    build: ./backend
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/shortener
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
  
  url-backend-3:
    build: ./backend
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/shortener
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
  # Nginx Load Balancer
  nginx:
    image: nginx:latest
    container_name: url_nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Mounts from the new nginx folder
    depends_on:
      - url-backend-1
      - url-backend-2

volumes:
  mongo_data: